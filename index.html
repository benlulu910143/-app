<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幣種買入紀錄</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; color: #cbd5e1; }
    select, input { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #475569; }
    #result { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
    .success { background: #065f46; color: #34d399; }
  </style>
</head>
<body>

<div class="card">
  <h2>新增買入成本</h2>
  
  <label>選擇幣種</label>
 <select id="symbol">
  <option value="BTC">BTC</option>
  <option value="ETH">ETH</option>
  <option value="SOL">SOL</option>
  <option value="ADA">ADA</option>
  <option value="LINK">LINK</option>
</select>
  
  <label>單價 (USDT)</label>
  <input type="number" id="price" step="any" placeholder="例如: 95480">
  
  <label>數量</label>
  <input type="number" id="amount" step="any" placeholder="例如: 0.0005">
  
  <button id="btn" onclick="submitRecord()">送出紀錄</button>
  
  <div id="result"></div>
</div>

<script>
  // ⚠️ 請填入你在第二步部署時獲得的 Apps Script Web App URL
  const API_URL = "https://script.google.com/macros/s/AKfycbw40kwKM4Z5dUD5nFDekdUSzODdb8B5pr4wWABI03E8O4JOEMSxPqwXf03a-EqyJA7DTw/exec";

  // 頁面開啟時自動抓取 G 列幣種選單
  window.onload = function() {
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById("symbol");
        select.innerHTML = "";
        data.symbols.forEach(s => {
          select.innerHTML += `<option value="${s}">${s}</option>`;
        });
      });
  };

  // 送出資料至 Google Sheet
  function submitRecord() {
    const symbol = document.getElementById("symbol").value;
    const price = document.getElementById("price").value;
    const amount = document.getElementById("amount").value;
    const btn = document.getElementById("btn");
    const resultDiv = document.getElementById("result");

    if (!price || !amount) {
      alert("請輸入單價與數量！");
      return;
    }

    btn.disabled = true;
    btn.innerText = "資料計算與寫入中...";

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ symbol, price, amount })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "送出紀錄";
      
      // 清空輸入框
      document.getElementById("price").value = "";
      document.getElementById("amount").value = "";

      // 顯示後端算好並回傳的總成本
      resultDiv.className = "success";
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `✅ 成功寫入 Sheet！<br>本次購入成本：USDT $${res.cost}`;
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "送出紀錄";
      alert("發生錯誤：" + err);
    });
  }
</script>

</body>
</html>
